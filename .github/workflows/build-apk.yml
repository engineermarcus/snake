name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Assets
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap add android || true
          npx cap sync android

      - name: Update Android Version & App ID
        run: |
          cd frontend/android/app
          # Increment versionCode and versionName on every push/run
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" build.gradle
          echo "=== Updated build.gradle version details ==="
          grep -E "versionCode|versionName" build.gradle

      - name: Prepare Signing Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom release keystore from GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'snake_key' }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD || 'snake123456' }}" >> $GITHUB_ENV
            echo "STORE_PASS=${{ secrets.KEYSTORE_PASSWORD || 'snake123456' }}" >> $GITHUB_ENV
          else
            echo "Generating signing keystore for release build..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias snake_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "snake123456" \
              -keypass "snake123456" \
              -dname "CN=SnakeGame, OU=Mobile, O=SnakeGame, L=SanFrancisco, S=CA, C=US"
            echo "KEY_ALIAS=snake_key" >> $GITHUB_ENV
            echo "KEY_PASS=snake123456" >> $GITHUB_ENV
            echo "STORE_PASS=snake123456" >> $GITHUB_ENV
          fi

      - name: Build Android APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Align and Sign APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"

          UNSIGNED_APK=$(find frontend/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found compiled APK at: $UNSIGNED_APK"

          OUTPUT_APK="SnakeArena-v1.0.${{ github.run_number }}.apk"

          # Align the APK
          $BUILD_TOOLS_DIR/zipalign -f -v -p 4 "$UNSIGNED_APK" aligned-app.apk || cp "$UNSIGNED_APK" aligned-app.apk

          # Sign the APK with v1, v2, and v3 schemes using apksigner
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT_APK" \
            aligned-app.apk

          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify --verbose "$OUTPUT_APK"
          echo "SIGNED_APK_NAME=$OUTPUT_APK" >> $GITHUB_ENV

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakeArena-v1.0.${{ github.run_number }}
          path: SnakeArena-v1.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Snake Arena v1.0.${{ github.run_number }}
          body: |
            🎮 **Snake Arena Android APK**

            - **App ID**: `com.snake.game`
            - **Version Name**: `1.0.${{ github.run_number }}`
            - **Version Code**: `${{ github.run_number }}`
            - **Backend URL**: `https://snake-rp2o.onrender.com`
            - **WebSocket URL**: `wss://snake-rp2o.onrender.com`

            ### How to Install:
            1. Download `SnakeArena-v1.0.${{ github.run_number }}.apk` from Assets below.
            2. Open the downloaded APK on your Android device to install / update.
          files: |
            SnakeArena-v1.0.${{ github.run_number }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
